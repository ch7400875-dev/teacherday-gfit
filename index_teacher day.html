<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Teacher's Day ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      overflow: hidden;
    }

    /* Background glowing circles */
    .circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(5px);
      opacity: 0.25;
      animation: float 6s ease-in-out infinite;
    }

    .circle.one {
      width: 180px;
      height: 180px;
      background: #ffd166;
      top: 5%;
      left: -50px;
    }

    .circle.two {
      width: 220px;
      height: 220px;
      background: #06d6a0;
      bottom: -70px;
      right: -60px;
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    /* Main card */
    .card {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      color: white;
      z-index: 2;
      animation: cardIn 1s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .emoji {
      font-size: 65px;
      animation: bounce 2s infinite;
      margin-bottom: 10px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1.1;
      margin-bottom: 18px;
      text-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    h1 span {
      color: #ffe066;
    }

    .message {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #fff;
      margin-bottom: 25px;
    }

    .quote {
      font-size: 1.2rem;
      font-style: italic;
      font-weight: 600;
      color: #ffe066;
      margin: 20px 0;
    }

    .teacher {
      font-size: 1rem;
      margin-top: 15px;
      opacity: 0.9;
    }

    button {
      margin-top: 25px;
      border: none;
      outline: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: #ffe066;
      color: #5a3d00;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 14px;
      top: -20px;
      z-index: 10;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .emoji {
        font-size: 55px;
      }

      .message {
        font-size: 0.95rem;
      }

      .quote {
        font-size: 1.05rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="circle one"></div>
  <div class="circle two"></div>

  <div class="card">

    <div class="emoji">👩‍🏫📚❤️</div>

    <h1>
      Happy <span>Teacher's Day!</span>
    </h1>

    <p class="message">
      To the amazing teacher who inspires us,
      guides us, and makes learning beautiful —
      thank you for everything you do! 🌟
    </p>

    <div class="quote">
      "A great teacher can change a life."
    </div>

    <p class="teacher">
      🌸 With lots of respect & gratitude 🌸
    </p>

    <button onclick="celebrate()">
      🎉 Celebrate Again
    </button>

  </div>

  <script>

    function createConfetti() {

      const confettiCount = 120;

      for (let i = 0; i < confettiCount; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        const colors = [
          "#ff595e",
          "#ffca3a",
          "#8ac926",
          "#1982c4",
          "#6a4c93",
          "#ffffff"
        ];

        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.width =
          Math.random() * 8 + 5 + "px";

        confetti.style.height =
          Math.random() * 12 + 6 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function celebrate() {
      createConfetti();
    }

    // Start celebration automatically
    window.onload = function() {
      setTimeout(createConfetti, 500);
    };

  </script>

</body>
</html>
